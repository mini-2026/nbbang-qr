name: build
on:
  push:
    branches: [main]
    paths: ['android/**', 'site/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - id: v
        name: Read version
        run: |
          code=$(grep -oP 'versionCode:\s*\K\d+' android/apktool.yml)
          name=$(grep -oP 'versionName:\s*\K[0-9.]+' android/apktool.yml)
          scheme=$(python3 -c "import json;print(json.load(open('site/about.json'))['tag'])")
          if [ "$scheme" = code ]; then tag="v$code"; else tag="v$name"; fi
          echo "ver=$name" >> $GITHUB_OUTPUT; echo "TAG=$tag" >> $GITHUB_ENV; echo "VER=$name" >> $GITHUB_ENV
          if gh release view "$tag" >/dev/null 2>&1; then echo "SKIP=1" >> $GITHUB_ENV; fi
        env: { GH_TOKEN: '${{ github.token }}' }
      - name: Build APK
        if: env.SKIP != '1'
        run: |
          curl -sSL -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          echo "c0350abbab5314248dfe2ee0c907def4edd14f6faef1f5d372d3d4abd28f0431  /tmp/apktool.jar" | sha256sum -c -
          java -jar /tmp/apktool.jar b android -o /tmp/unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -P 16 -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          echo "BT=$BT" >> $GITHUB_ENV
      - name: Signing key
        if: env.SKIP != '1'
        env: { PASS: '${{ secrets.SIGNING_PASS }}', KEY_B64: '${{ secrets.SIGNING_KEY_B64 }}' }
        run: |
          if [ ${#PASS} -lt 16 ]; then echo "::error::Add secret SIGNING_PASS (16+ characters)"; exit 1; fi
          mkdir -p keys
          # 서명 키는 Secret(SIGNING_KEY_B64)을 먼저 쓰고, 없으면 예전처럼 저장소 파일을 써요.
          # 새 키는 절대 만들지 않아요 (키가 바뀌면 업데이트 설치가 안 돼요).
          if [ -n "$KEY_B64" ]; then printf '%s' "$KEY_B64" | base64 -d > keys/release.p12
          elif [ ! -f keys/release.p12 ]; then echo "::error::Add secret SIGNING_KEY_B64 (signing key missing; never generate a new one)"; exit 1; fi
          keytool -list -keystore keys/release.p12 -storetype PKCS12 -storepass "$PASS" -alias app >/dev/null
      - name: Sign APK
        if: env.SKIP != '1'
        env: { PASS: '${{ secrets.SIGNING_PASS }}' }
        run: |
          APK=$(python3 -c "import json;print(json.load(open('site/about.json'))['apk'])")
          $BT/apksigner sign --ks keys/release.p12 --ks-pass env:PASS --ks-key-alias app --out "/tmp/$APK" /tmp/aligned.apk
          $BT/apksigner verify --print-certs "/tmp/$APK" | grep -E 'SHA-256'
          echo "APK=/tmp/$APK" >> $GITHUB_ENV
      - name: Release
        if: env.SKIP != '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          NAME=$(python3 -c "import json;print(json.load(open('site/about.json'))['name'])")
          gh release create "$TAG" "$APK" --title "$NAME v$VER" --notes "$NAME v$VER" --target "$GITHUB_SHA"
  site:
    needs: apk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: python3 tools/site.py
        env: { REPO: '${{ github.repository }}', APP_VER: '${{ needs.apk.outputs.ver }}' }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  pages:
    needs: site
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
