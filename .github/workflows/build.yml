name: build
on:
  push:
    branches: [main]
    paths: ['android/**', 'site/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  site:
    needs: apk
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: python3 tools/site.py
        env: { REPO: '${{ github.repository }}', APP_VER: '${{ needs.apk.outputs.ver }}' }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  pages:
    needs: site
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
